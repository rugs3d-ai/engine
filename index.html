<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Rugs3D - AR Experience</title>
    <link rel="stylesheet" type="text/css" href="index.css">

    <link rel="preconnect" href="https://cdn.8thwall.com" crossorigin>
    <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="//cdn.8thwall.com">
    <link rel="dns-prefetch" href="//ajax.googleapis.com">
    <link rel="preload" href="./xr.js" as="script">

    <!-- Google Model Viewer for 3D preview -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <!-- 8-Frame: 8th Wall's patched A-Frame (includes Three.js) -->
    <script defer src="//cdn.8thwall.com/web/aframe/8frame-1.4.1.min.js"></script>

    <!-- XRExtras: gesture detector, loading screen, permissions handling -->
    <script defer src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

    <!-- 8th Wall Self-Hosted Engine - World Effects (SLAM) -->
    <script async src="./xr.js" data-preload-chunks="slam"></script>

    <!-- Client code (A-Frame components + page logic) -->
    <script defer src="index.js"></script>
  </head>

  <body>
    <!-- Preview Page - shown by default -->
    <div id="preview-page">
      <model-viewer
        id="model-viewer"
                                src="./carpet_model_20260210_094217.glb"
                        alt="3D Wall Art Preview"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
      ></model-viewer>
      <button id="view-ar-btn" class="view-ar-button">
        <svg class="ar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="spinner"></span>
        <span id="btn-text">View in AR</span>
      </button>
    </div>

    <!--
      AR Scene held in a <template> so A-Frame does NOT auto-initialize on page load.
      It is cloned into #ar-container when "View in AR" is clicked.
    -->
    <template id="ar-scene-template">
      <a-scene
        id="ar-scene"
        xrextras-gesture-detector
        xrextras-loading
        xrextras-runtime-error
        xrweb="scale: absolute"
        renderer="colorManagement: true"
        ar-place>

        <a-assets>
          <a-asset-item
            id="rugModel"
                                          src="./carpet_model_20260210_094217.glb">
                              </a-asset-item>
        </a-assets>

        <a-camera
          id="camera"
          position="0 1.6 0"
          raycaster="objects: .cantap"
          cursor="fuse: false; rayOrigin: mouse;">
        </a-camera>

        <a-entity
          light="type: directional; intensity: 0.8"
          position="0 10 0">
        </a-entity>
        <a-entity
          light="type: hemisphere; color: #ffffff; groundColor: #444444; intensity: 1">
        </a-entity>
        <a-light type="ambient" intensity="0.8"></a-light>

        <!-- Wall base marker - thin grid planes hugging floor + wall -->
        <a-entity id="wall-marker" visible="false">
          <a-plane width="0.6" height="0.4" rotation="-90 0 0" position="0 0.003 0.2" grid-material="type: floor"></a-plane>
          <a-plane width="0.6" height="0.4" position="0 0.2 -0.003" grid-material="type: wall"></a-plane>
          <a-entity position="0 0.22 0.01" text="value: Align with wall\ncorner & Tap; align: center; color: #fff; width: 0.58; wrapCount: 18; baseline: center; anchor: center; opacity: 1; shader: msdf; outlineColor: #000; outlineWidth: 0.03; outlineOpacity: 0.9; side: double"
            animation="property: scale; from: 0.92 0.92 0.92; to: 1.08 1.08 1.08; dur: 1200; easing: easeInOutSine; loop: true; dir: alternate"></a-entity>
        </a-entity>

        <!-- Floor marker - flat pulsating grid that follows gaze on ground -->
        <a-entity id="floor-marker" visible="false">
          <a-plane width="0.8" height="0.8" rotation="-90 0 0" position="0 0 0" grid-material="type: floor"
            animation="property: scale; from: 0.9 0.9 0.9; to: 1.1 1.1 1.1; dur: 1000; easing: easeInOutSine; loop: true; dir: alternate">
          </a-plane>
          <a-entity rotation="-90 0 0" position="0 0.01 0" text="value: Tap to place; align: center; color: #fff; width: 0.9; wrapCount: 18; baseline: center; anchor: center; opacity: 1; shader: msdf; outlineColor: #000; outlineWidth: 0.03; outlineOpacity: 0.9; side: double"
            animation="property: scale; from: 0.9 0.9 0.9; to: 1.1 1.1 1.1; dur: 1000; easing: easeInOutSine; loop: true; dir: alternate"></a-entity>
        </a-entity>

        <!-- Wall art entity (hidden until wall is created) with gesture components -->
        <a-entity
          id="placed-rug"
          gltf-model="#rugModel"
          visible="false"
          position="0 -999 0"
          scale="1 1 1"
          class="cantap"
          xrextras-two-finger-rotate
          xrextras-pinch-scale="min: 0.3; max: 3"
          configure-rug-material
          shadow="receive: false; cast: false">
        </a-entity>

        <!-- Invisible ground for floor raycasting -->
        <a-entity
          id="ground"
          class="cantap"
          geometry="primitive: box"
          material="color: #fff; transparent: true; opacity: 0"
          scale="1000 2 1000"
          position="0 -1 0">
        </a-entity>
      </a-scene>
    </template>

    <!-- Container where the a-scene will be injected on "View in AR" click -->
    <div id="ar-container"></div>

    <!-- Instant overlay shown after View in AR to hide black init frames -->
    <div id="ar-start-overlay" style="display: none;">
      <div class="ar-start-overlay-content">
        <div class="ar-start-spinner"></div>
        <div class="ar-start-text">Starting camera…</div>
      </div>
    </div>

    <!-- Back button - outside a-scene to stay on top -->
    <button id="back-btn" class="back-button" style="display: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Mode toggle buttons -->
    <div id="mode-toggle" style="display: none;">
      <button class="mode-btn active" data-mode="wall">Wall</button>
      <button class="mode-btn" data-mode="floor">Floor</button>
    </div>

    <!-- Crosshair for wall aiming (shown during wall phase) -->
    <div id="crosshair" style="display: none;"></div>

    <!-- Tap gesture indicator - outside a-scene to avoid z-index conflicts -->
    <div id="tap-indicator" style="display: none;">
      <div class="tap-circle tap-circle-outer"></div>
      <div class="tap-circle tap-circle-inner"></div>
      <span class="tap-text">Align corner with wall base & tap</span>
    </div>
  </body>
</html>
