	   <script async src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/16.3.5/Tween.min.js"></script>
	   <script async src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

	   <script src="index.js?v=27"></script>
	 </head>
	
	 <body>

	   <div id="preview-page">

     <canvas id="camerafeed"></canvas>

	</html>
